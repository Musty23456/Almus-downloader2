name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty when the secrets are not set (forks, pull requests): the signed build is then skipped.
      KEYSTORE_B64: ${{ secrets.ALMUS_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency and build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almus-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: almus-yt-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK (version and permissions)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          echo "APK: $APK"
          "$AAPT2" dump badging "$APK" | grep -E "^package:"
          PERMS=$("$AAPT2" dump permissions "$APK")
          echo "$PERMS"
          for p in INTERNET POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do
            echo "$PERMS" | grep -q "android.permission.$p" || { echo "Expected permission missing: $p"; exit 1; }
          done
          if echo "$PERMS" | grep -E "MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|READ_MEDIA_|REQUEST_INSTALL_PACKAGES"; then
            echo "A broad storage or install permission was found. This app must not request it."
            exit 1
          fi
          echo "APK verification passed."

      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        env:
          ALMUS_KEYSTORE_PASSWORD: ${{ secrets.ALMUS_KEYSTORE_PASSWORD }}
          ALMUS_KEY_ALIAS: ${{ secrets.ALMUS_KEY_ALIAS }}
          ALMUS_KEY_PASSWORD: ${{ secrets.ALMUS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/almus-release.jks"
          export ALMUS_KEYSTORE_PATH="$RUNNER_TEMP/almus-release.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/almus-release.jks"

      - name: Verify release signature
        if: env.KEYSTORE_B64 != ''
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "APK: $APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: almus-yt-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
